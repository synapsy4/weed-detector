stages:
  download:
    cmd: python scripts/run.py --config config.yaml --config-root configs download
    deps:
      - configs/config.yaml
      - src/weed_detector/data/download.py
    outs:
      - data/raw

  preprocess:
    cmd: python scripts/run.py --config config.yaml --config-root configs preprocess
    deps:
      - configs/config.yaml
      - data/raw
      - src/weed_detector/data/preprocess.py
    outs:
      - data/processed
      - configs/yolo.yaml

  train:
    cmd: python scripts/run.py --config config.yaml --config-root configs train
    deps:
      - configs/config.yaml
      - configs/yolo.yaml
      - data/processed
      - src/weed_detector/training/train.py
    outs:
      - models/trained/modelv0/train

  evaluate:
    cmd: python scripts/run.py --config config.yaml --config-root configs eval
    deps:
      - configs/config.yaml
      - models/trained/modelv0/train
      - src/weed_detector/training/evaluate.py
    metrics:
      - models/trained/modelv0/eval/metrics.json
