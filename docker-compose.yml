services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1 # print statements and log messages appear immediately in the logs
    volumes:
      - ./models:/app/models:ro
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge