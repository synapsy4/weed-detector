[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weed-detector"
version = "0.1.0"
description = "YOLO based weed vs. crop detector and classifier."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics==8.4.66",
    "torch",
    "kagglehub==1.0.2",
    "matplotlib==3.11.0",
    "numpy==2.0.0",
    "Pillow==11.2.1",
    "PyYAML==6.0.2",
    "scikit_learn==1.9.0",
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "python-multipart==0.0.9",
    "prometheus_client==0.21.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipython",
    "jupyter",
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weed_detector"]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
