# Pre-commit hooks for the weed-detector project.
#
# Install:  uv run pre-commit install
# Run all:  uv run pre-commit run --all-files

repos:
  # Ruff lint (with auto-fix) and formatting.
  #
  # Scope matches the CI workflow exactly (`ruff check src/ tests/`), so
  # running the hooks locally never rewrites files that CI does not check
  # (notebooks/ and scripts/ are deliberately left untouched).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^(notebooks|scripts)/
      - id: ruff-format
        exclude: ^(notebooks|scripts)/

  # Local hooks mirroring the CI pipeline (invoked via uv).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        always_run: true
        pass_filenames: false

      - id: pytest
        name: pytest (coverage >= 80%)
        entry: uv run pytest tests/ --cov=src/weed_detector --cov-fail-under=80
        language: system
        always_run: true
        pass_filenames: false
